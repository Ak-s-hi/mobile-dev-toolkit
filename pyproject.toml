[project]
name = "mobile-dev-toolkit"
version = "0.1.0"
description = "CLI tool for analyzing Flutter projects"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "click>=8.1.7",
    "pyyaml>=6.0"
]

[project.scripts]
mobile-dev-toolkit = "toolkit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolkit"]

# this files helps to create the command "mobile-dev-toolkit" # which executes toolkit.cli.main()